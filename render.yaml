services:
  - type: web
    name: kavach-backend
    runtime: python
    region: oregon
    plan: free
    branch: Backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-ping-interval 20 --ws-ping-timeout 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HOME
        value: /tmp/huggingface
      - key: NUMBA_CACHE_DIR
        value: /tmp/numba_cache
      - key: WHISPER_THREADS
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
